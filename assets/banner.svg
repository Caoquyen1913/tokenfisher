<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-labelledby="t">
  <title id="t">tokenfisher: catch only the tokens you need</title>
  <rect width="1280" height="400" rx="28" fill="#0A1C31"/>
  <svg x="64" y="64" width="272" height="272" viewBox="0 0 512 512">
  
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10345A"/>
      <stop offset="1" stop-color="#071729"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3DD3F5"/>
      <stop offset="1" stop-color="#1667D6"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB054"/>
      <stop offset="1" stop-color="#F0761C"/>
    </linearGradient>
    <radialGradient id="coin" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFF1B0"/>
      <stop offset="0.55" stop-color="#FFC93C"/>
      <stop offset="1" stop-color="#D8961A"/>
    </radialGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)"/>

    <!-- noise: the tokens you don't need -->
    <g fill="#5C7A99" opacity="0.55">
      <circle cx="70" cy="300" r="9"/><circle cx="112" cy="352" r="7"/><circle cx="330" cy="330" r="8"/>
      <circle cx="390" cy="290" r="6"/><circle cx="430" cy="350" r="9"/><circle cx="300" cy="392" r="6"/>
      <circle cx="56" cy="410" r="6"/><circle cx="452" cy="420" r="7"/><circle cx="380" cy="410" r="5"/>
      <circle cx="140" cy="420" r="5"/>
    </g>

    <!-- water -->
    <path d="M0 448 C 60 430, 110 466, 170 448 S 280 430, 340 448 S 450 466, 512 446 V512 H0 Z" fill="#0E4C7A" opacity="0.9"/>
    <path d="M0 474 C 70 458, 120 490, 190 474 S 300 458, 370 474 S 470 490, 512 472 V512 H0 Z" fill="#0A3A60"/>

    <!-- the one token worth catching -->
    <g transform="translate(196 372)">
      <circle r="44" fill="url(#coin)"/>
      <circle r="34" fill="none" stroke="#B87A10" stroke-width="4" opacity="0.6"/>
      <path d="M-16 -16 H16 M0 -16 V20" stroke="#8A5A08" stroke-width="9" stroke-linecap="round"/>
    </g>
    <!-- dive trail -->
    <path d="M300 88 Q 360 40 430 60" stroke="#3DD3F5" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.35"/>
    <path d="M330 130 Q 400 90 462 104" stroke="#3DD3F5" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.22"/>

    <!-- kingfisher, diving at the coin: drawn facing left, then rotated -->
    <g transform="translate(210 338) rotate(-52)">
      <!-- tail -->
      <path d="M232 -6 L298 -26 L292 2 L300 22 L236 14 Z" fill="#1252B0"/>
      <!-- body -->
      <ellipse cx="168" cy="6" rx="74" ry="34" fill="url(#belly)"/>
      <path d="M96 -8 C 130 -40, 210 -42, 244 -6 C 214 -14, 150 -12, 100 6 Z" fill="url(#back)"/>
      <!-- wing swept back -->
      <path d="M128 -18 C 176 -66, 252 -84, 300 -74 C 262 -52, 222 -24, 176 -6 Z" fill="#1667D6"/>
      <path d="M150 -26 C 190 -58, 246 -70, 282 -68 C 250 -52, 214 -34, 180 -20 Z" fill="#3DD3F5" opacity="0.75"/>
      <!-- head -->
      <circle cx="98" cy="0" r="34" fill="url(#back)"/>
      <ellipse cx="104" cy="16" rx="20" ry="12" fill="url(#belly)"/>
      <ellipse cx="86" cy="22" rx="12" ry="8" fill="#FFFFFF"/>
      <circle cx="90" cy="-8" r="7.5" fill="#FFFFFF"/>
      <circle cx="88" cy="-8" r="4" fill="#0B1220"/>
      <!-- beak -->
      <path d="M70 -10 L-6 2 L70 12 Z" fill="#1A1F2B"/>
      <path d="M70 1 L-6 2 L70 12 Z" fill="#323A4C"/>
    </g>
  </g>
</svg>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="392" y="168" font-size="92" font-weight="800" fill="#FFFFFF" letter-spacing="-2">token<tspan fill="#3DD3F5">fisher</tspan></text>
    <text x="396" y="222" font-size="34" fill="#C9D6E6">Catch only the tokens you need.</text>
    <text x="396" y="290" font-size="26" font-weight="600" fill="#FFC93C">−14.5% cost on the same model · −61.6% with Sonnet routing</text>
    <text x="396" y="330" font-size="22" fill="#7F96B2">Same quality: 60/60 A/B runs pass hidden tests · token diet for Claude Code</text>
  </g>
</svg>
